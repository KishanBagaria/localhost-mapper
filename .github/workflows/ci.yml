name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Puppeteer's browser is only needed by the integration suite, which
      # can't run here (see below).
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'

      # Biome: lint + format check in one pass.
      - run: npm run lint
      # Builds first, then typechecks the tests against the build output.
      - run: npm run typecheck

      # Only the unit suite runs in CI. The integration tests drive a real
      # browser through the machine's proxy auto-config, which needs admin
      # rights and a GUI network stack — run `npm run test:integration` locally.
      - run: npx ava test/unit
